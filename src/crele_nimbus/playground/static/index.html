<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crele Nimbus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141413'/%3E%3Ccircle cx='11' cy='16' r='3' fill='%23f0efec'/%3E%3Cpath d='M16 9.5a9 9 0 0 1 0 13M20.5 6a14 14 0 0 1 0 20' stroke='%23f0efec' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <section class="hero">
      <h1>Crele Nimbus: A real-time audio decision model</h1>
      <p class="sub">Ask yes/no questions about the live audio.</p>

      <button class="mic" id="mic" type="button" aria-label="Start listening" disabled>
        <span class="ring" aria-hidden="true"></span>
        <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/>
        </svg>
        <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/>
        </svg>
      </button>
      <p class="caption" id="caption">Connecting to the model…</p>
      <button class="link" id="file-link" type="button" hidden>or play an audio file</button>
      <input type="file" id="file-input" accept="audio/*,.wav,.flac,.mp3,.m4a,.ogg" hidden>
    </section>

    <section class="board" aria-label="Questions and answers">
      <div class="lanes" id="lanes">
        <div id="rows"></div>
        <canvas id="tl" aria-hidden="true"></canvas>
      </div>
      <form class="ask" id="ask" autocomplete="off">
        <span class="plus" aria-hidden="true">+</span>
        <input id="ask-text" type="text" maxlength="200"
               placeholder="Ask another question, e.g. Is a dog barking?" aria-label="Ask another question">
      </form>
    </section>
    <div class="axis"><span>30 s ago</span><span>now</span></div>
  </main>

  <footer class="foot" id="foot"></footer>

  <div class="overlay" id="drop" hidden><p>Drop it to play it to the model</p></div>
  <div class="overlay" id="gesture" hidden>
    <div><p>The browser plays sound only after a click.</p>
      <button class="go" id="gesture-go" type="button">Play</button></div>
  </div>
  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <!-- The questions a first visit starts with. The server reads this block too, so
       they are encoded before the page asks. -->
  <script type="application/json" id="defaults">
["Is music playing?"]
  </script>
  <script src="app.js"></script>
</body>
</html>
